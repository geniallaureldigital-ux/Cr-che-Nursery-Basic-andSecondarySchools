<style>
    /* ===========================
   GENERAL
=========================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f4f7fb;
    display:flex;
    min-height:100vh;
    color:#333;
}

/* ===========================
   SIDEBAR
=========================== */

.sidebar{
    width:260px;
    background:#0d47a1;
    color:#fff;
    min-height:100vh;
    position:fixed;
    left:0;
    top:0;
    overflow:auto;
    box-shadow:3px 0 15px rgba(0,0,0,.15);
}

.logo{
    text-align:center;
    padding:25px 15px;
    border-bottom:1px solid rgba(255,255,255,.15);
}

.logo img{
    width:90px;
    height:90px;
    border-radius:50%;
    background:#fff;
    padding:6px;
    margin-bottom:12px;
}

.logo h2{
    font-size:17px;
    font-weight:600;
    line-height:1.4;
}

.logo span{
    display:block;
    margin-top:8px;
    color:#ffd54f;
    font-size:14px;
}

.sidebar ul{
    list-style:none;
    margin-top:20px;
}

.sidebar ul li{
    padding:18px 25px;
    cursor:pointer;
    transition:.3s;
    display:flex;
    align-items:center;
    gap:12px;
    font-size:15px;
}

.sidebar ul li:hover,
.sidebar ul li.active{
    background:#1565c0;
    border-left:5px solid #ffd54f;
}

.sidebar i{
    width:20px;
    text-align:center;
}

/* ===========================
   MAIN
=========================== */

.main{
    margin-left:260px;
    width:calc(100% - 260px);
    padding:30px;
}

/* ===========================
   TOPBAR
=========================== */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
    flex-wrap:wrap;
}

.topbar h1{
    color:#0d47a1;
    font-size:28px;
}

.admin{
    background:#fff;
    padding:10px 18px;
    border-radius:40px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
    font-weight:600;
}

.admin i{
    color:#f9a825;
    margin-right:8px;
}

/* ===========================
   CARDS
=========================== */

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.card{
    background:#fff;
    border-radius:15px;
    padding:25px;
    text-align:center;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
    transition:.3s;
}

.card:hover{
    transform:translateY(-6px);
}

.card i{
    font-size:40px;
    color:#0d47a1;
    margin-bottom:15px;
}

.card h2{
    color:#f9a825;
    font-size:34px;
    margin-bottom:8px;
}

.card p{
    color:#666;
}

/* ===========================
   SEARCH
=========================== */

.searchBox{
    position:relative;
    margin-bottom:25px;
}

.searchBox input{
    width:100%;
    padding:15px 50px 15px 18px;
    border:none;
    border-radius:50px;
    background:#fff;
    font-size:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
    outline:none;
}

.searchBox i{
    position:absolute;
    right:20px;
    top:17px;
    color:#0d47a1;
}

/* ===========================
   TABLE
=========================== */

.table-container{
    background:#fff;
    border-radius:15px;
    overflow:auto;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:900px;
}

thead{
    background:#0d47a1;
    color:#fff;
}

thead th{
    padding:18px;
    text-align:left;
    font-size:15px;
}

tbody td{
    padding:16px;
    border-bottom:1px solid #eee;
    font-size:14px;
}

tbody tr:hover{
    background:#f5f9ff;
}

/* ===========================
   BUTTONS
=========================== */

.view-btn,
.download-btn{
    text-decoration:none;
    color:#fff;
    padding:9px 16px;
    border-radius:8px;
    display:inline-block;
    transition:.3s;
    font-size:14px;
    border:none;
    cursor:pointer;
    font-family:inherit;

}


.view-btn{
    background:#0d47a1;
}

.view-btn:hover{
    background:#1565c0;
}

.download-btn{
    background:#f9a825;
}

.download-btn:hover{
    background:#f57f17;
}

.view-btn i,
.download-btn i{
    margin-right:6px;
}

/* ===========================
   SCROLLBAR
=========================== */

::-webkit-scrollbar{
    width:8px;
    height:8px;
}

::-webkit-scrollbar-thumb{
    background:#0d47a1;
    border-radius:20px;
}

/* ===========================
   RESPONSIVE
=========================== */

@media(max-width:900px){

.sidebar{
    position:relative;
    width:100%;
    min-height:auto;
}

.main{
    margin-left:0;
    width:100%;
}

.topbar{
    gap:15px;
}

.cards{
    grid-template-columns:1fr;
}

}

@media(max-width:600px){

.topbar h1{
    font-size:22px;
}

.logo h2{
    font-size:15px;
}

.searchBox input{
    font-size:14px;
}

thead th,
tbody td{
    padding:12px;
    font-size:13px;
}

.view-btn,
.download-btn{
    padding:8px 12px;
    font-size:12px;
}

}
</style>

let filteredStudents = [];

function loadStudents() {
  filteredStudents = [...students];
  displayStudents(filteredStudents);

  const totalStudentsEl = document.getElementById("totalStudents");
  const totalResultsEl = document.getElementById("totalResults");
  const totalPinsEl = document.getElementById("totalPins");

  if (totalStudentsEl) totalStudentsEl.innerHTML = students.length;
  if (totalResultsEl) totalResultsEl.innerHTML = students.length;
  if (totalPinsEl) totalPinsEl.innerHTML = students.length;
}

function displayStudents(list) {
  const table = document.getElementById("studentTable");
  if (!table) return;

  table.innerHTML = "";

  list.forEach((student, index) => {
    table.innerHTML += `
      <tr>
        <td>${index + 1}</td>
        <td>${student.name}</td>
        <td>${student.class}</td>
        <td>${student.pin}</td>
        <td>
          <button class="view-btn" onclick="openResult('${student.file}')">
            <i class="fa-solid fa-eye"></i> View
          </button>
        </td>
        <td>
          <a class="download-btn" href="${student.file}" download>
            <i class="fa-solid fa-download"></i> Download
          </a>
        </td>
      </tr>
    `;
  });
}

function openResult(file) {
  window.open(file, "_blank");
}

function searchStudent() {
  const searchInput = document.getElementById("search");
  if (!searchInput) return;

  let keyword = searchInput.value.toLowerCase();

  filteredStudents = students.filter(
    (student) =>
      student.name.toLowerCase().includes(keyword) ||
      student.class.toLowerCase().includes(keyword) ||
      student.pin.toLowerCase().includes(keyword)
  );

  displayStudents(filteredStudents);
}

function logout() {
  if (confirm("Logout Admin Officer?")) {
    window.location = "admin-login.html";
  }
}

// Automatically load student records when the page loads
document.addEventListener("DOMContentLoaded", loadStudents);
