<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Genial Laurel School | Admin Portal</title>

<link rel="stylesheet" href="reportlanding.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
<style>
    /*==============================
    GOOGLE FONT
==============================*/

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(135deg,#003366,#0056b3,#0b7dda);
}

/*==============================
    ANIMATED BACKGROUND
==============================*/

.background{
    position:fixed;
    width:100%;
    height:100%;
    overflow:hidden;
    z-index:-2;
}

.background span{
    position:absolute;
    display:block;
    border-radius:50%;
    animation:float 18s linear infinite;
    bottom:-180px;
    background:rgba(255,255,255,.08);
}

.background span:nth-child(1){
    left:10%;
    width:180px;
    height:180px;
    animation-duration:18s;
}

.background span:nth-child(2){
    left:40%;
    width:280px;
    height:280px;
    animation-duration:25s;
}

.background span:nth-child(3){
    left:65%;
    width:120px;
    height:120px;
    animation-duration:15s;
}

.background span:nth-child(4){
    left:85%;
    width:230px;
    height:230px;
    animation-duration:22s;
}

@keyframes float{

0%{

transform:translateY(0) rotate(0deg);

opacity:.3;

}

100%{

transform:translateY(-1200px) rotate(360deg);

opacity:0;

}

}

/*==============================
    LOGIN WRAPPER
==============================*/

.login-wrapper{
    width:100%;
    max-width:470px;
    padding:20px;
}

/*==============================
    BACK BUTTON
==============================*/

.back-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color:#fff;
    margin-bottom:20px;
    font-size:15px;
    transition:.3s;
}

.back-btn:hover{
    color:#FFD700;
}

/*==============================
    LOGIN CARD
==============================*/

.login-card{

background:rgba(255,255,255,.15);

backdrop-filter:blur(18px);

-webkit-backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.2);

border-radius:25px;

padding:40px;

text-align:center;

box-shadow:0 25px 45px rgba(0,0,0,.35);

animation:fadeIn .9s;

}

@keyframes fadeIn{

from{

opacity:0;

transform:translateY(50px);

}

to{

opacity:1;

transform:translateY(0);

}

}

/*==============================
LOGO
==============================*/

.logo img{

width:110px;

height:110px;

border-radius:50%;

background:#fff;

padding:10px;

box-shadow:0 0 25px rgba(255,215,0,.6);

animation:pulse 3s infinite;

}

@keyframes pulse{

50%{

transform:scale(1.06);

}

}

/*==============================
TEXT
==============================*/

.login-card h1{

margin-top:20px;

color:#fff;

font-size:32px;

font-weight:700;

letter-spacing:2px;

}

.subtitle{

color:#eee;

margin-top:10px;

margin-bottom:35px;

font-size:15px;

}

/*==============================
INPUTS
==============================*/

.input-group{

position:relative;

margin-bottom:22px;

}

.input-group i:first-child{

position:absolute;

left:18px;

top:18px;

color:#0056b3;

font-size:18px;

}

.input-group input{

width:100%;

padding:15px 50px;

border:none;

outline:none;

border-radius:50px;

font-size:15px;

background:#fff;

transition:.35s;

}

.input-group input:focus{

box-shadow:0 0 18px rgba(255,215,0,.6);

transform:translateY(-2px);

}

.eye{

position:absolute;

right:18px;

top:18px;

cursor:pointer;

color:#0056b3;

font-size:18px;

}

/*==============================
BUTTON
==============================*/

button{

width:100%;

padding:15px;

border:none;

border-radius:50px;

font-size:17px;

font-weight:600;

cursor:pointer;

color:#003366;

background:linear-gradient(90deg,#FFD700,#FFC107);

transition:.35s;

box-shadow:0 10px 25px rgba(0,0,0,.3);

}

button:hover{

transform:translateY(-3px);

box-shadow:0 18px 35px rgba(0,0,0,.4);

}

button:active{

transform:scale(.98);

}

/*==============================
SECURITY NOTICE
==============================*/

.security{

margin-top:25px;

color:#fff;

font-size:14px;

opacity:.9;

}

.security i{

color:#FFD700;

margin-right:5px;

}

/*==============================
LOADER
==============================*/

#loader{

position:fixed;

inset:0;

display:none;

justify-content:center;

align-items:center;

flex-direction:column;

background:rgba(0,0,0,.9);

z-index:9999;

color:#fff;

}

.spinner{

width:75px;

height:75px;

border:7px solid rgba(255,255,255,.2);

border-top:7px solid #FFD700;

border-radius:50%;

animation:spin 1s linear infinite;

margin-bottom:25px;

}

@keyframes spin{

100%{

transform:rotate(360deg);

}

}

/*==============================
SHAKE
==============================*/

.shake{

animation:shake .4s;

}

@keyframes shake{

0%{transform:translateX(0);}
20%{transform:translateX(-10px);}
40%{transform:translateX(10px);}
60%{transform:translateX(-10px);}
80%{transform:translateX(10px);}
100%{transform:translateX(0);}

}

/*==============================
RESPONSIVE
==============================*/

@media(max-width:600px){

.login-wrapper{

padding:18px;

}

.login-card{

padding:30px 22px;

}

.login-card h1{

font-size:26px;

}

.logo img{

width:90px;

height:90px;

}

.subtitle{

font-size:14px;

}

button{

font-size:16px;

}

}


/*==========================
POPUP MESSAGE
==========================*/

.popup{

    position:fixed;

    top:30px;

    right:-400px;

    min-width:300px;

    background:#d32f2f;

    color:#fff;

    padding:18px 25px;

    border-radius:10px;

    font-size:15px;

    font-weight:500;

    box-shadow:0 10px 30px rgba(0,0,0,.3);

    transition:.5s;

    z-index:99999;

}

.popup.show{

    right:30px;

}

.popup::before{

    content:"⚠";

    margin-right:10px;

}
</style>
</head>

<body>

<!-- Animated Background -->

<div class="background">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>

<!-- Loader -->

<div id="loader">

<div class="spinner"></div>

<h2>Signing In...</h2>

<p>Please wait...</p>

</div>

<div class="login-wrapper">

<a href="index.html" class="back-btn">

<i class="fas fa-arrow-left"></i>

Back to Website

</a>

<div class="login-card">

<div class="logo">

<img src="data/glogo.png" alt="School Logo">

</div>

<h1>ADMIN PORTAL</h1>

<p class="subtitle">

Genial Laurel School Administration System

</p>

<div class="input-group">

<i class="fas fa-user-shield"></i>

<input
type="text"
id="username"
placeholder="Administrator Username"
autocomplete="off">

</div>

<div class="input-group">

<i class="fas fa-lock"></i>

<input
type="password"
id="password"
placeholder="Password">

<span class="eye" onclick="togglePassword()">

<i class="fas fa-eye" id="eye"></i>

</span>

</div>

<button id="loginBtn">

<i class="fas fa-right-to-bracket"></i>

LOGIN

</button>

<div class="security">

<i class="fas fa-shield-halved"></i>

Authorized Personnel Only

</div>

</div>

</div>

<script>

const USERNAME = "Admin Officer";
const PASSWORD = "Yimsas";

const loginBtn = document.getElementById("loginBtn");

loginBtn.addEventListener("click", login);

document.addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        login();
    }
});

function login(){

    let username = document.getElementById("username").value.trim();
    let password = document.getElementById("password").value.trim();

    if(
        username.toLowerCase() === USERNAME.toLowerCase() &&
        password === PASSWORD
    ){

        document.getElementById("loader").style.display="flex";

        setTimeout(function(){

            window.location.href="admin-dashboard.html";

        },1500);

    }else{

        document.querySelector(".login-card").classList.add("shake");

        setTimeout(function(){

            document.querySelector(".login-card").classList.remove("shake");

        },500);

        showPopup("❌ Invalid Username or Password");

    }

}

function togglePassword(){

    let pass = document.getElementById("password");
    let eye = document.getElementById("eye");

    if(pass.type==="password"){

        pass.type="text";

        eye.className="fas fa-eye-slash";

    }else{

        pass.type="password";

        eye.className="fas fa-eye";

    }

}

function showPopup(message){

    const popup=document.getElementById("popup");

    popup.innerHTML=message;

    popup.classList.add("show");

    setTimeout(function(){

        popup.classList.remove("show");

    },3000);

}

</script>
<div id="popup" class="popup"></div>
</body>
</html>
